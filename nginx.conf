# ==============================================================================
# Creatsify Studio - Nginx Configurations Guide
# ==============================================================================
# There are two deployment scenarios:
#
# SCENARIO A: aaPanel / CyberPanel / cPanel (Most Common)
#   If you are using aaPanel, DO NOT paste full "server { ... }" blocks into the
#   "URL rewrite" tab. Paste ONLY Section 1 below (or copy from aapanel_url_rewrite.conf).
#
# SCENARIO B: Dedicated Ubuntu / Debian VPS without Control Panel
#   Paste Section 2 into /etc/nginx/sites-available/creatsify.tech and symlink
#   to /etc/nginx/sites-enabled/.
# ==============================================================================

# ==============================================================================
# SECTION 1: aaPanel "URL rewrite" Box (Drop-in Clean Snippet)
# ==============================================================================
# Copy and paste ONLY this section into:
# aaPanel -> Websites -> creatsify.tech -> URL rewrite

# Security Headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Front Controller Pattern - Route all dynamic requests to index.php
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Custom Error Pages
error_page 404 /index.php;

# Protect internal application directories
location ~ ^/(app|config|core|database|storage|views)/ {
    deny all;
    return 404;
}

# Protect sensitive deployment files
location ~* (composer\.(json|lock)|\.lock|\.env|\.sql|\.sqlite|\.log)$ {
    deny all;
    return 404;
}


