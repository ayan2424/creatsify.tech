# ==============================================================================
# Creatsify Studio - Production Nginx Virtual Host Configuration
# Place in: /etc/nginx/sites-available/creatsify.tech
# Symlink to: /etc/nginx/sites-enabled/creatsify.tech
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name creatsify.tech www.creatsify.tech;

    # Redirect all HTTP traffic to HTTPS (uncomment when SSL is installed)
    # return 301 https://$host$request_uri;

    # Web Root must point to the /public directory
    root /var/www/creatsify.tech/public;
    index index.php index.html;

    charset utf-8;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # Front Controller Pattern - Route all dynamic requests to index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Custom Error Pages
    error_page 404 /index.php;

    # PHP-FPM FastCGI Execution
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        
        # Unix Socket (Ubuntu / Debian standard)
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        
        # TCP Port alternative (CentOS / Windows / Docker)
        # fastcgi_pass 127.0.0.1:9000;
        
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Mitigate httpoxy vulnerability
        fastcgi_param HTTP_PROXY "";

        # Buffer & Timeout optimization for heavy admin queries & live chat polling
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
        fastcgi_hide_header X-Powered-By;
    }

    # Static Assets Caching (Fonts, Images, CSS, JS)
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|css|js|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        log_not_found off;
    }

    # Deny direct access to hidden files (.env, .git, .htaccess, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Protect internal application directories
    location ~ ^/(app|config|core|database|storage|views)/ {
        deny all;
        return 404;
    }

    # Protect sensitive deployment files
    location ~* (composer\.(json|lock)|\.lock|\.env|\.sql|\.sqlite|\.log)$ {
        deny all;
        return 404;
    }

    # Logging
    access_log /var/log/nginx/creatsify.access.log;
    error_log /var/log/nginx/creatsify.error.log warn;
}

