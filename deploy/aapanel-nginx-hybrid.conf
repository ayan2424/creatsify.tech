# ==============================================================================
# Creatsify.tech — aaPanel Hybrid Nginx URL Rewrite Rules
# Paste ONLY the blocks below into aaPanel -> Website -> creatsify.tech -> URL Rewrite
# (Do NOT add an outer server {} block, gzip on;, or duplicate php-fpm blocks.)
#
# Architecture:
#   - /admin, /api, /uploads, /assets, /install.php, /sitemap.xml -> Custom PHP 8.4 MVC
#   - All Public Frontend Routes (/, /portfolio, /services, ...)  -> Next.js SSR/ISR (127.0.0.1:3000)
# ==============================================================================

# 1. Custom PHP 8.4 MVC Backend: Admin Panel, Headless API v1, Chat, Webhooks, Sitemap
location ^~ /admin {
    try_files $uri $uri/ /index.php?$query_string;
}

location ^~ /api {
    try_files $uri $uri/ /index.php?$query_string;
}

location = /sitemap.xml {
    try_files /index.php?$query_string =404;
}

location = /install.php {
    try_files $uri =404;
}

# 2. Direct static serving of PHP brand assets & admin media uploads
location ^~ /assets/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
}

location ^~ /uploads/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public";
}

# 3. Protect internal PHP MVC directories & sensitive files
location ~ ^/(app|config|core|database|storage|views|frontend/src)/ {
    deny all;
    return 404;
}

location ~* (composer\.(json|lock)|\.env|\.sql|\.sqlite|\.log)$ {
    deny all;
    return 404;
}

# 4. Next.js 15 App Router Frontend (Node.js PM2 running on 127.0.0.1:3000)
location ^~ /_next/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    expires 365d;
    add_header Cache-Control "public, immutable";
}

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
}
